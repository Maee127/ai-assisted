[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-lead-intelligence-pipeline"
version = "0.1.0"
description = "Authorized Instagram beauty and skincare lead intelligence pipeline."
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.18,<2.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3,<3.0",
    "pytest>=9.1,<10.0",
    "ruff>=0.16,<0.17",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
