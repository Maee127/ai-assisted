[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-lead-intelligence-pipeline"
version = "0.1.0"
description = "Authorized Instagram beauty and skincare lead intelligence pipeline."
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
